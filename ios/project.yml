# OrneryKiwi iOS project — generate with: xcodegen generate
# Install xcodegen: brew install xcodegen

name: OrneryKiwi

options:
  bundleIdPrefix: com.ornery-kiwi
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.4"
  createIntermediateGroups: true
  groupSortPosition: top
  usesTabs: false
  indentWidth: 4
  tabWidth: 4

settings:
  base:
    DEVELOPMENT_TEAM: ""          # ← fill in your Apple Developer Team ID
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_PREVIEWS: YES
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

configs:
  Debug: debug
  Release: release

targets:

  # ── Main app ──────────────────────────────────────────────────────────────
  OrneryKiwi:
    type: application
    platform: iOS
    deploymentTarget: "17.0"

    sources:
      - path: OrneryKiwi
        excludes:
          - "**/*.entitlements"
          - "**/*.plist"
        headerVisibility: public
      - path: OrneryKiwi/Info.plist
        buildPhase: none

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ornery-kiwi.app
        INFOPLIST_FILE: OrneryKiwi/Info.plist
        CODE_SIGN_ENTITLEMENTS: OrneryKiwi/OrneryKiwi.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"         # iPhone + iPad
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO

    dependencies:
      - target: OrneryKiwiShare
        embed: true

  # ── Share Extension ───────────────────────────────────────────────────────
  OrneryKiwiShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"

    sources:
      - path: ShareExtension
        excludes:
          - "**/*.entitlements"
          - "**/*.plist"
      - path: ShareExtension/Info.plist
        buildPhase: none

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ornery-kiwi.app.share
        INFOPLIST_FILE: ShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShareExtension/ShareExtension.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES

schemes:
  OrneryKiwi:
    build:
      targets:
        OrneryKiwi: all
        OrneryKiwiShare: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
